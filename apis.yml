name: uncommonbio
description: >-
  Uncommon (uncommonbio.co, formerly Higher Steaks) is a Cambridge, UK biotechnology
  company backed by Balderton Capital. The company sold its cultivated meat platform to
  Vow and has pivoted to launch SymphoRNA, a new venture developing nucleic acid delivery
  technology for multi-RNA combination medicines that target complex diseases such as
  fibrosis, heart failure, and neurodegeneration. As a life-sciences research and platform
  company, Uncommon publishes no public developer program, API, or machine-readable API
  specification. This profile was added to the API Evangelist network as a portfolio lead
  of Balderton Capital and enriched via the local enrichment pipeline, which confirmed the
  absence of an API surface while capturing live domain-security posture.
